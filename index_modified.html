<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>豬豬快跑</title>
<style>
:root{--bg:#bfe8fb;--ui:#3b2a20;--card:#fffaf3;--btn:#ff8fa3;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2440;--ui:#fbe9e0;--card:#2b2f4a}}
:root[data-theme="dark"]{--bg:#1b2440;--ui:#fbe9e0;--card:#2b2f4a}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ui);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#wrap{position:relative;width:100%;height:100%;touch-action:none}
canvas{position:absolute;inset:0;display:block}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#card{background:var(--card);padding:20px 26px;border-radius:20px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:82%}
#card h1{margin:0 0 6px;font-size:28px}
#card p{margin:4px 0 14px;line-height:1.6;font-size:15px}
button{font:inherit;font-size:18px;font-weight:700;background:var(--btn);color:var(--btnt);border:0;border-radius:999px;padding:10px 30px}
button:active{transform:scale(.96)}
#card button{display:block;margin:8px auto}
button.g{background:#9a8cf0}
button:disabled{opacity:.4}
#shop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4)}
#sc{background:var(--card);padding:16px 20px;border-radius:20px;width:min(340px,88%);max-height:84%;overflow-y:auto;touch-action:pan-y;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.3);box-sizing:border-box}
#sc h1{margin:0 0 4px;font-size:24px;text-align:center}
#sc button{font-size:15px;padding:6px 14px;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(128,128,128,.25)}
.row small{display:block;opacity:.75;font-size:12px}
.sec{font-weight:700;margin-top:10px}
.bs{display:flex;flex-direction:column;gap:6px;align-items:stretch}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="ov"><div id="card">
<h1 id="t">🐷 豬豬快跑</h1>
<p id="m">左半邊螢幕：跳躍（可二段跳）<br>右半邊螢幕：按住滑行，鑽過 🦇<br>吃 🍬 得分、喝 🧪 補體力<br>⚡ 衝刺無敵　🧲 磁鐵吸糖果<br>跑到 🏁 就過關，一路闖更多關！</p>
<button id="b">開始遊戲</button>
<button id="s" class="g">🛍️ 養成商店</button>
</div></div>
<div id="shop"><div id="sc"></div></div>
</div>
